[package]
name = "ascii_art_app_lib"
version = "1.0.0"
description = "High-Throughput Sealed ASCII Art Engine"
authors = ["SakamotoMrX <andrahijati@gmail.com>"]
edition = "2021"

[lib]
name = "ascii_art_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ascii_art_app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "rayon"] }
rayon = "1.10"
thiserror = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
